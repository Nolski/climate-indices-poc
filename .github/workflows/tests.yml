name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      # The sample station file is not stored in this repository (see NOTICE); the variant station
      # files are derived from it with a fixed seed. The R tool itself is never run here: its
      # outputs for the default case and the variants are tracked under baseline/.
      - name: Fetch the sample station and derive the variant inputs
        run: |
          scripts/fetch_sample.sh
          uv run python baseline/make_variants.py

      - name: Tests
        run: uv run pytest -ra
