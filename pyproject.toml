[project]
name = "climpoc"
version = "0.1.0"
description = "Independent proof of concept: Climpact-style climate indices for station data, in Python on xclim"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "xclim==1.0.0",
    "xarray>=2026.9,<2027",
    "pandas>=3.1,<4",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "brotli-asgi>=1.4",
]

[project.scripts]
climpoc = "climpoc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=0.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climpoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Import\\(s\\) unavailable to set up matplotlib support:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "validate"]
extend-exclude = ["baseline", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# One line per registry entry reads better than wrapped descriptions.
"src/climpoc/indices/registry.py" = ["E501"]
# Report text and table rows.
"validate/*.py" = ["E501"]
